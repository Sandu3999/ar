<!DOCTYPE html>
<html lang="ja">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime UFO</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #02040b; }
        #ui {
            position: fixed; top: 20px; left: 22px; z-index: 20;
            padding: 14px 20px; border-radius: 10px;
            background: rgba(5, 9, 20, 0.7);
            border: 1px solid rgba(180, 210, 255, 0.4);
            backdrop-filter: blur(8px); color: white; font-family: Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #title { font-size: 15px; font-weight: bold; letter-spacing: 2px; color: #fff; }
        #subtitle { margin-top: 6px; font-size: 12px; color: #64caff; letter-spacing: 1px; font-weight: bold; }
        #flash {
            position: fixed; inset: 0; z-index: 30; pointer-events: none;
            background: rgba(255, 255, 255, 0); transition: background 0.05s ease-out;
        }
    </style>
</head>
 
<body>
    <div id="ui">
        <div id="title">VILLAGE</div>
        <div id="subtitle">UFO クリックしてください 🛸</div>
    </div>
    <div id="flash"></div>
 
    <a-scene
        fog="type: exponential; color: #07101d; density: 0.015"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; shadowMapEnabled: true; shadowMapType: PCFSoftShadowMap"
        cursor="rayOrigin: mouse">
 
        <a-assets>
            <a-mixin id="trunk" material="color: #38271e; roughness: 1; flatShading: true"></a-mixin>
            <a-mixin id="darkLeaf" material="color: #10231d; roughness: 0.9; flatShading: true"></a-mixin>
            <a-mixin id="greenLeaf" material="color: #2a5947; roughness: 0.9; flatShading: true"></a-mixin>
            <a-mixin id="bush" material="color: #1a3c2a; roughness: 1; flatShading: true"></a-mixin>
            <a-mixin id="rock" material="color: #444c5b; roughness: 1; flatShading: true"></a-mixin>
            <a-mixin id="wall" material="color: #2a2e39; roughness: 0.8; flatShading: true"></a-mixin>
            <a-mixin id="roof" material="color: #151821; roughness: 0.9; flatShading: true"></a-mixin>
        </a-assets>
 
        <a-sky color="#030713"></a-sky>
       
        <a-camera position="0 2.5 14" look-controls="enabled: true" wasd-controls="enabled: true"></a-camera>
 
        <!-- LIGHTING -->
        <a-entity id="ambientLight" light="type: ambient; color: #7893c5; intensity: 0.35"></a-entity>
        <a-entity light="type: directional; color: #c8dcff; intensity: 1.8; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048" position="5 15 -15" rotation="-45 15 0"></a-entity>
 
        <!-- GROUND -->
        <a-plane position="0 0 -10" rotation="-90 0 0" width="80" height="80" material="color: #122119; roughness: 1" shadow="receive: true"></a-plane>
 
        <!-- MOON -->
        <a-entity id="moon" position="8 16 -25">
            <a-sphere radius="3" material="color: #fffbe8; emissive: #fff0b8; emissiveIntensity: 2; roughness: 1; flatShading: true"></a-sphere>
            <a-sphere radius="4" material="color: #d3e5ff; emissive: #a9c9f5; emissiveIntensity: 1; opacity: 0.15; transparent: true; side: double"></a-sphere>
        </a-entity>
 
        <!-- STARS -->
        <a-entity id="star-field"></a-entity>
 

        <!-- LIGHTHOUSE-->
       
        <a-entity position="-16 0 -10">
            <a-cylinder radius-bottom="1.5" radius-top="1" height="8" position="0 4 0" material="color: #dcdcdc; roughness: 0.8" shadow="cast: true"></a-cylinder>
            <a-cylinder radius="1.2" height="1" position="0 8.5 0" material="color: #8c1e1e" shadow="cast: true"></a-cylinder>
            <a-sphere position="0 8.5 0" radius="0.8" material="color: #fffcbd; emissive: #fff200; emissiveIntensity: 3"></a-sphere>
            <a-entity light="type: point; color: #fff200; intensity: 2; distance: 20" position="0 8.5 0"></a-entity>
            <a-entity position="0 8.5 0" animation="property: rotation; to: 0 -360 0; loop: true; dur: 10000; easing: linear">
                <a-cone position="0 0 5" rotation="-90 0 0" radius-bottom="4" radius-top="0.2" height="10" material="color: #fff200; emissive: #fff200; emissiveIntensity: 1; opacity: 0.25; transparent: true; side: double; blending: additive"></a-cone>
            </a-entity>
        </a-entity>
 
       
        <!--HOUSE-->
        <a-entity id="house" position="8 0 -4" rotation="0 -30 0" scale="2 2 2">
            <a-box mixin="wall" width="3.5" height="2.2" depth="3" position="0 1.1 0" shadow="cast: true; receive: true"></a-box>
            <a-box color="#1e1815" width="3.6" height="0.1" depth="3.1" position="0 0.1 0"></a-box>
            <a-box color="#1e1815" width="3.6" height="0.1" depth="3.1" position="0 2.1 0"></a-box>
            <a-cone mixin="roof" radius-bottom="3.2" height="1.8" segments-radial="4" rotation="0 45 0" position="0 3.1 0" shadow="cast: true"></a-cone>
            <a-plane position="-0.8 1.2 1.51" width="0.9" height="0.8" material="color: #ffe6a0; emissive: #ffaa00; emissiveIntensity: 3"></a-plane>
            <a-box color="#111" width="0.95" height="0.05" depth="0.02" position="-0.8 1.2 1.52"></a-box>
            <a-box color="#111" width="0.05" height="0.85" depth="0.02" position="-0.8 1.2 1.52"></a-box>
            <a-plane position="0.7 0.9 1.51" width="0.8" height="1.6" material="color: #2b1f1a; roughness: 0.9"></a-plane>
            <a-sphere position="1 0.9 1.53" radius="0.05" color="#555"></a-sphere>
            <a-entity light="type: point; color: #ffaa00; intensity: 1.2; distance: 8" position="-0.8 1.2 2"></a-entity>
        </a-entity>
 
        
        <!--UFO-->
        <a-entity
            id="ufo"
            class="clickable"
            position="-2 4.5 -3"
            scale="1.5 1.5 1.5"
            animation__hover="property: position; to: -2 5 -3; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
            animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
           
            
            <a-cylinder radius="2.7" height="0.3" segments="64" material="color: #1e2836; metalness: 0.95; roughness: 0.15" shadow="cast: true"></a-cylinder>
            <a-cylinder position="0 -0.2" radius="2.4" height="0.25" segments="64" material="color: #0f1621; metalness: 0.9; roughness: 0.2"></a-cylinder>
            <a-torus position="0 0.15 0" rotation="90 0 0" radius="2.7" radius-tubular="0.05" material="color: #435875; metalness: 0.9; roughness: 0.1"></a-torus>
         
            <a-sphere position="0 0.35 0" radius="1.3" scale="1.4 0.65 1.4" material="color: #415b76; metalness: 0.8; roughness: 0.05; opacity: 0.82; transparent: true"></a-sphere>
           
            <a-sphere position="0 0.45 0" radius="0.5" scale="1.4 0.5 1.4" material="color: #d9f3ff; emissive: #00d5ff; emissiveIntensity: 5; opacity: 0.9; transparent: true" animation="property: scale; dir: alternate; loop: true; dur: 1500; from: 1.2 0.4 1.2; to: 1.5 0.6 1.5"></a-sphere>
 
            
            <a-entity position="0 0.7 0">
            
                <a-cylinder radius="0.15" height="0.2" material="color: #2b394a; metalness: 0.9"></a-cylinder>
                <a-torus position="0 0.1 0" rotation="90 0 0" radius="0.18" radius-tubular="0.02" material="color: #5d7899; metalness: 0.9"></a-torus>
               
        
                <a-cylinder position="0 0.7 0" radius="0.035" height="1.2" material="color: #8faec4; metalness: 0.95; roughness: 0.1"></a-cylinder>
               
            
                <a-torus position="0 0.5 0" rotation="90 0 0" radius="0.25" radius-tubular="0.015" material="color: #00e1ff; emissive: #00a2ff; emissiveIntensity: 3"></a-torus>
                <a-torus position="0 0.8 0" rotation="90 0 0" radius="0.15" radius-tubular="0.015" material="color: #00e1ff; emissive: #00a2ff; emissiveIntensity: 3"></a-torus>
               
            
                <a-sphere position="0 1.3 0" radius="0.1" material="color: #ff2255; emissive: #ff0033; emissiveIntensity: 6" animation="property: material.emissiveIntensity; from: 1; to: 10; dir: alternate; loop: true; dur: 350"></a-sphere>
                <a-entity light="type: point; color: #ff0033; intensity: 1.5; distance: 4" position="0 1.3 0"></a-entity>
            </a-entity>
 
            
            <a-entity id="light-ring">
                <a-sphere position="2.75 0 0" radius="0.1" material="color: #ff2222; emissive: #ff0000; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="-2.75 0 0" radius="0.1" material="color: #00ff66; emissive: #00ff44; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="0 0 2.75" radius="0.1" material="color: #2288ff; emissive: #0066ff; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="0 0 -2.75" radius="0.1" material="color: #ffff00; emissive: #ffea00; emissiveIntensity: 6"></a-sphere>
               
                <a-sphere position="1.94 0 1.94" radius="0.1" material="color: #ff00ff; emissive: #e100ff; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="-1.94 0 -1.94" radius="0.1" material="color: #00ffff; emissive: #00f0ff; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="-1.94 0 1.94" radius="0.1" material="color: #ff8800; emissive: #ff6600; emissiveIntensity: 6"></a-sphere>
                <a-sphere position="1.94 0 -1.94" radius="0.1" material="color: #aa00ff; emissive: #8800ff; emissiveIntensity: 6"></a-sphere>
            </a-entity>
 
            
            <a-cylinder position="0 -0.35 0" radius="1.1" height="0.1" material="color: #111; metalness: 0.9"></a-cylinder>
            <a-sphere position="0 -0.42 0" radius="0.8" scale="1 0.25 1" material="color: #ffffff; emissive: #00d5ff; emissiveIntensity: 8" animation="property: material.emissiveIntensity; from: 5; to: 9; dir: alternate; loop: true; dur: 600"></a-sphere>
 
            
            <a-entity light="type: point; color: #00c3ff; intensity: 2; distance: 8" position="0 -1 0"></a-entity>
 
            
            <a-entity id="tractor-beam" animation="property: rotation; to: 0 -360 0; loop: true; dur: 6000; easing: linear">
                <a-cone position="0 -3.5 0" radius-bottom="5" radius-top="0.8" height="6.5" material="color: #88cfff; emissive: #33a9ff; emissiveIntensity: 2; opacity: 0.2; transparent: true; side: double; blending: additive" animation="property: material.opacity; from: 0.1; to: 0.3; dir: alternate; loop: true; dur: 1200"></a-cone>
                <a-cylinder position="0 -3.5 0" radius="1.2" height="6.5" material="color: #ffffff; emissive: #66c2ff; emissiveIntensity: 3; opacity: 0.3; transparent: true; side: double; blending: additive" animation="property: radius; from: 1; to: 1.4; dir: alternate; loop: true; dur: 600"></a-cylinder>
                <a-circle position="0 -6.7 0" rotation="-90 0 0" radius="5" material="color: #33a9ff; emissive: #33a9ff; emissiveIntensity: 2; opacity: 0.4; transparent: true" animation="property: radius; from: 4.8; to: 5.2; dir: alternate; loop: true; dur: 1200"></a-circle>
            </a-entity>
        </a-entity>
 
        
        <!-- 木 -->
        
        <a-entity position="-10 0 -3" scale="1.2 1.2 1.2"><a-cylinder mixin="trunk" radius="0.25" height="3" position="0 1.5 0"></a-cylinder><a-cone mixin="darkLeaf" radius-bottom="1.8" height="3" position="0 3 0" shadow="cast: true"></a-cone><a-cone mixin="greenLeaf" radius-bottom="1.2" height="2" position="0 4.5 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="-3 0 -12" scale="1.4 1.4 1.4"><a-cylinder mixin="trunk" radius="0.3" height="4" position="0 2 0"></a-cylinder><a-cone mixin="darkLeaf" radius-bottom="2.2" height="3.5" position="0 3.8 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="2 0 -14"><a-cylinder mixin="trunk" radius="0.25" height="3.5" position="0 1.75 0"></a-cylinder><a-cone mixin="greenLeaf" radius-bottom="1.8" height="2.8" position="0 3 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="14 0 -8" scale="1.3 1.3 1.3"><a-cylinder mixin="trunk" radius="0.2" height="3" position="0 1.5 0"></a-cylinder><a-cone mixin="darkLeaf" radius-bottom="1.5" height="2.5" position="0 2.8 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="12 0 2"><a-cylinder mixin="trunk" radius="0.3" height="3.5" position="0 1.75 0"></a-cylinder><a-cone mixin="darkLeaf" radius-bottom="2" height="3" position="0 3.2 0" shadow="cast: true"></a-cone><a-cone mixin="greenLeaf" radius-bottom="1.2" height="2" position="0 4.8 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="-12 0 4" scale="0.9 0.9 0.9"><a-cylinder mixin="trunk" radius="0.25" height="3" position="0 1.5 0"></a-cylinder><a-cone mixin="darkLeaf" radius-bottom="1.8" height="2.8" position="0 3 0" shadow="cast: true"></a-cone></a-entity>
        <a-entity position="-3 0 2" scale="0.8 0.8 0.8"><a-cylinder mixin="trunk" radius="0.2" height="3" position="0 1.5 0"></a-cylinder><a-cone mixin="greenLeaf" radius-bottom="1.5" height="2.5" position="0 2.8 0" shadow="cast: true"></a-cone></a-entity>
       
 
        <a-dodecahedron mixin="bush" radius="0.8" position="4 0.3 -2" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.6" position="-8 0.2 -2" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="1.1" position="-2 0.4 -9" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.7" position="6 0.3 -12" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.9" position="11 0.4 -1" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.5" position="-14 0.2 1" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.8" position="-4 0.3 4" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="1.2" position="14 0.5 -4" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="0.7" position="-10 0.3 -6" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="bush" radius="1.0" position="0 0.4 -13" shadow="cast: true"></a-dodecahedron>
       
        <!--石 -->
        <a-dodecahedron mixin="rock" radius="0.5" position="-5 0.1 -2" rotation="20 45 0" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="rock" radius="0.4" position="3 0.1 -6" rotation="15 80 10" shadow="cast: true"></a-dodecahedron>
        <a-dodecahedron mixin="rock" radius="0.6" position="-11 0.1 2" rotation="45 15 -20" shadow="cast: true"></a-dodecahedron>
 
    </a-scene>
 
    <script>
        
        const starField = document.getElementById('star-field');
        for (let i = 0; i < 250; i++) {
            const star = document.createElement('a-sphere');
            const x = (Math.random() - 0.5) * 100;
            const y = Math.random() * 40 + 10;
            const z = (Math.random() - 0.5) * 100 - 15;
           
            star.setAttribute('position', `${x} ${y} ${z}`);
            star.setAttribute('radius', Math.random() * 0.08 + 0.02);
            star.setAttribute('color', '#ffffff');
            star.setAttribute('material', 'emissive: #ffffff; emissiveIntensity: 2; shader: flat');
            starField.appendChild(star);
        }
 
        
        const ufo = document.getElementById('ufo');
        const tractorBeam = document.getElementById('tractor-beam');
        let isFlying = false;
 
        ufo.addEventListener('click', () => {
            if (isFlying) return;
            isFlying = true;
 
            
            tractorBeam.setAttribute('visible', 'false');
 
            
            ufo.removeAttribute('animation__hover');
 
            
            ufo.setAttribute('animation__fly1', 'property: position; to: 4 12 -15; dur: 3000; easing: easeInOutQuad');
           
            setTimeout(() => {
                ufo.removeAttribute('animation__fly1');
               
                
                ufo.setAttribute('animation__fly2', 'property: position; to: 10 16 -30; dur: 2000; easing: linear');
               
                setTimeout(() => {
                    ufo.removeAttribute('animation__fly2');
                   
                    
                    ufo.setAttribute('animation__fly3', 'property: position; to: -2 4.5 -3; dur: 5000; easing: easeInOutCubic');
                   
                    setTimeout(() => {
                        ufo.removeAttribute('animation__fly3');
                       
                        
                        tractorBeam.setAttribute('visible', 'true');
                        ufo.setAttribute('animation__hover', 'property: position; to: -2 5 -3; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine');
                        isFlying = false;
                    }, 3000);
                }, 2000);
            }, 2000);
        });
 
 
        // --- RAIN EFFECT ---(AIが作ってくれた。)
        const scene = document.querySelector('a-scene');
        for (let i = 0; i < 400; i++) {
            const drop = document.createElement('a-cylinder');
            const x = (Math.random() - 0.5) * 70;
            const y = Math.random() * 20 + 5;
            const z = (Math.random() - 0.5) * 70 - 5;
            drop.setAttribute('position', `${x} ${y} ${z}`);
            drop.setAttribute('radius', '0.01');
            drop.setAttribute('height', '1.5');
            drop.setAttribute('color', '#a5c0e8');
            drop.setAttribute('material', 'shader: flat; opacity: 0.3; transparent: true');
            const fallDuration = Math.random() * 150 + 250;
            drop.setAttribute('animation', `property: position; to: ${x} -1 ${z}; dur: ${fallDuration}; loop: true; easing: linear`);
            scene.appendChild(drop);
        }
    </script>
</body>
</html>
